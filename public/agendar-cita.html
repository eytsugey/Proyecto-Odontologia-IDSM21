<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historia Clínica | Solicitud de Cita</title>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .wrap{ max-width: 980px; margin: 18px auto 28px; padding: 0 14px; }
    .sheet{
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 22px;
      border: 1px solid var(--color-border);
    }
    .top{
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
      align-items:flex-end;
      margin-bottom: 10px;
    }
    .top h1{ font-size: 20px; margin: 0; }
    .top .date{ display:flex; gap:8px; align-items:center; }
    .muted{ color: var(--color-muted); font-size: 12px; margin-top: 4px; }

    .sec-title{
      margin: 18px 0 10px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .2px;
      color: var(--color-texto);
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }
    .grid3{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }
    .field{ display:flex; flex-direction:column; gap:6px; }
    .field label{ font-size: 12px; font-weight: 800; color: var(--color-muted); }
    .field input, .field select, .field textarea{
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      background:#fff;
    }
    .field textarea{ resize: vertical; }
    .field-wide{ grid-column: 1 / -1; }
    .yn{
      display:flex; gap:10px; align-items:center; flex-wrap:wrap;
      padding: 10px 12px; border: 1px solid var(--color-border); border-radius: 12px;
      background:#fff;
    }
    .yn label{ font-size: 13px; font-weight: 700; color: var(--color-texto); }
    .yn .opt{ display:flex; gap:6px; align-items:center; }
    .sep{ border:0; height:1px; background: var(--color-border); margin: 14px 0; }

    .actions{
      margin-top: 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn{
      border:0;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 900;
      cursor: pointer;
      background: var(--color-sidebar);
      color:#fff;
    }
    .btn:hover{ filter: brightness(1.08); }
    .note{ font-size:12px; color: var(--color-muted); }

    @media (max-width: 768px){
      .grid, .grid3{ grid-template-columns: 1fr; }
      .top{ align-items:flex-start; }
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="sheet">

    <div class="top">
      <div>
        <h1>HISTORIA CLÍNICA – Solicitud de Cita</h1>
        <div class="muted">El paciente envía la solicitud. El secretario confirmará la cita.</div>
      </div>
      <div class="date field" style="min-width:220px;">
        <label>Fecha</label>
        <input type="date" name="fecha_form" form="formCita" required>
      </div>
    </div>

    <form id="formCita" action="../api/citas.php?action=solicitar" method="POST">

      <!-- ===================== -->
      <!-- DATOS DEL PACIENTE    -->
      <!-- ===================== -->
      <div class="sec-title">DATOS DEL PACIENTE</div>

      <div class="grid">
        <div class="field field-wide">
          <label>Nombre del paciente *</label>
          <input type="text" name="nombre" required>
        </div>

        <div class="field">
          <label>Sexo *</label>
          <select name="sexo" required>
            <option value="">Seleccione</option>
            <option>Masculino</option>
            <option>Femenino</option>
          </select>
        </div>

        <div class="field">
          <label>Edad *</label>
          <input type="number" name="edad" min="0" max="120" required>
        </div>

        <div class="field">
          <label>Fecha de nacimiento *</label>
          <input type="date" name="fecha_nacimiento" required>
        </div>

        <div class="field">
          <label>Lugar de nacimiento</label>
          <input type="text" name="lugar_nacimiento">
        </div>

        <div class="field">
          <label>Estado civil</label>
          <input type="text" name="estado_civil">
        </div>

        <div class="field field-wide">
          <label>Domicilio</label>
          <input type="text" name="domicilio">
        </div>

        <div class="field">
          <label>Colonia</label>
          <input type="text" name="colonia">
        </div>

        <div class="field">
          <label>Ocupación</label>
          <input type="text" name="ocupacion">
        </div>

        <div class="field">
          <label>Teléfono o celular *</label>
          <input type="text" name="telefono" required>
        </div>
      </div>

      <hr class="sep">

      <!-- ===================== -->
      <!-- ANTECEDENTES MÉDICOS  -->
      <!-- ===================== -->
      <div class="sec-title">ANTECEDENTES MÉDICOS</div>

      <div class="grid">
        <div class="field field-wide">
          <label>¿Es alérgico a algún medicamento o alimento? (¿Cuál?)</label>
          <input type="text" name="alergias">
        </div>

        <div class="field field-wide">
          <label>¿Ha sido intervenido quirúrgicamente en los últimos 5 años? (¿De qué?)</label>
          <input type="text" name="cirugias_5anios">
        </div>

        <div class="field field-wide">
          <label>¿Reacciones con anestesia local o dental? (¿Cuál?)</label>
          <input type="text" name="reaccion_anestesia">
        </div>

        <div class="field">
          <label>¿Problemas de sangrado/coagulación?</label>
          <select name="sangrado">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>¿Diabetes mellitus?</label>
          <select name="diabetes">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>Medicamento (diabetes)</label>
          <input type="text" name="med_diabetes" placeholder="Opcional">
        </div>

        <div class="field">
          <label>¿Presión alta?</label>
          <select name="presion_alta">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>Medicamento (presión alta)</label>
          <input type="text" name="med_presion_alta" placeholder="Opcional">
        </div>

        <div class="field">
          <label>¿Presión baja?</label>
          <select name="presion_baja">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>Medicamento (presión baja)</label>
          <input type="text" name="med_presion_baja" placeholder="Opcional">
        </div>

        <div class="field field-wide">
          <label>¿Otra enfermedad? (¿Cuál?)</label>
          <input type="text" name="otra_enfermedad">
        </div>

        <div class="field field-wide">
          <label>¿Toma otro medicamento? (¿Para qué?)</label>
          <input type="text" name="otros_meds">
        </div>

        <div class="field">
          <label>¿Está embarazada?</label>
          <select name="embarazo">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>¿Cuántos meses?</label>
          <input type="number" name="meses_embarazo" min="0" max="9" placeholder="0">
        </div>

        <div class="field">
          <label>¿Fuma?</label>
          <select name="fuma">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>¿Toma alcohol?</label>
          <select name="toma">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>¿Farmacodependiente?</label>
          <select name="farmacodependiente">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field field-wide">
          <label>Enfermedades venéreas (sífilis, gonorrea, VIH, etc). ¿Cuál?</label>
          <input type="text" name="enf_venereas">
        </div>

        <div class="field">
          <label>¿Hepatitis?</label>
          <select name="hepatitis">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>¿Qué tipo?</label>
          <input type="text" name="hepatitis_tipo" placeholder="Opcional">
        </div>

        <div class="field">
          <label>¿Asma?</label>
          <select name="asma">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field field-wide">
          <label>¿Hábitos perniciosos (morder uñas, lápices, succionar dedo)? ¿Cuál?</label>
          <input type="text" name="habitos_perniciosos">
        </div>
      </div>

      <hr class="sep">

      <!-- ===================== -->
      <!-- MOTIVO / DENTISTA      -->
      <!-- ===================== -->
      <div class="sec-title">MOTIVO Y DATOS DENTALES</div>

      <div class="grid">
        <div class="field field-wide">
          <label>Motivo de consulta *</label>
          <textarea name="motivo" rows="3" required></textarea>
        </div>

        <div class="field">
          <label>Primera vez que acude al dentista</label>
          <select name="primera_vez">
            <option value="NO">NO</option>
            <option value="SI">SI</option>
          </select>
        </div>

        <div class="field">
          <label>Última visita</label>
          <input type="text" name="ultima_visita" placeholder="Ej. hace 6 meses">
        </div>

        <div class="field field-wide">
          <label>¿Tiene molestia o dolor en su boca?</label>
          <input type="text" name="dolor">
        </div>
      </div>

      <hr class="sep">

      <!-- ===================== -->
      <!-- PREFERENCIA DE CITA    -->
      <!-- ===================== -->
      <div class="sec-title">PREFERENCIA DE CITA</div>

      <div class="grid3">
        <div class="field">
          <label>Fecha preferida</label>
          <input type="date" name="fecha_preferida">
        </div>
        <div class="field">
          <label>Hora preferida</label>
          <input type="time" name="hora_preferida">
        </div>
        <div class="field">
          <label>Contacto (correo)</label>
          <input type="email" name="email" placeholder="Opcional">
        </div>
      </div>

      <div class="actions">
        <div class="note">
          Al enviar, tu solicitud queda <strong>pendiente</strong>. Un secretario la confirmará.
        </div>
        <button class="btn" type="submit">Enviar solicitud</button>
      </div>

    </form>

  </div>
</div>

</body>
</html>
