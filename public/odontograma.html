<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odontograma | Sistema Odontológico</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <h2>🦷 DentalApp</h2>
        <nav>
            <a href="dashboard_empleado.html">Dashboard</a>
            <a href="historial.html">Historial</a>
            <a class="active">Odontograma</a>
        </nav>
    </aside>

    <main class="main">

        <div class="odontograma-wrap">
        <div class="odontograma-header">
            <h2>Odontograma</h2>
            <div class="odontograma-help">Selecciona un diente y cambia el estado. El color se actualiza al instante.</div>
        </div>

        <section class="odontograma-container">

            <div class="arcada superior" id="arcadaSuperior"></div>

            <div class="arcada inferior" id="arcadaInferior"></div>

        </section>

        <section class="panel-control">
            <label>ID Historial:
            <input type="number" id="idHistorial" placeholder="Ej: 12">
            </label>

            <label>Estado:
            <select id="estadoDiente">
                <option value="sano">Sano</option>
                <option value="caries">Caries</option>
                <option value="restaurado">Restaurado</option>
                <option value="extraido">Extraído</option>
                <option value="fracturado">Fracturado</option>
                <option value="endodoncia">Endodoncia</option>
            </select>
            </label>

            <label>Descripción:
            <textarea id="descripcionDiente" rows="2" placeholder="Notas del diente..."></textarea>
            </label>

            <button onclick="guardarDiente()">Guardar</button>
            <button onclick="cargarOdontograma()">Recargar</button>
        </section>
    </main>

</div>

<script src="js/app.js"></script>

</body>
</html>
